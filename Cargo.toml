[package]
name = "almanac"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
html-escape = "0.3.0"
jieba-rs = "0.11.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ulid = "3.0.0"
unicode-normalization = "0.1.26"
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }

[dev-dependencies]
tempfile = "3.27.0"
